<div style="max-width: 600px; margin: 40px auto; padding: 30px; text-align: center; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <h2 style="color: #28a745;">✅ 予約が完了しました！</h2>
    <p>ご予約ありがとうございます。当日はこちらのQRコードをご提示ください。</p>

    <div style="margin: 30px 0;">
        <img src="data:image/png;base64,{{ qr_b64 }}" alt="QRコード" style="max-width: 280px; width: 100%;">
        <p style="color: #888; font-size: 0.85em; margin-top: 12px;">（予約一覧画面からもQRコードは確認できます。）</p>
    </div>

    <a href="{% url 'reservations:store_list' %}" style="display: inline-block; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px;">
        店舗一覧に戻る
    </a>
</div>
